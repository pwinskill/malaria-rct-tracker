name: Weekly malaria RCT scan

on:
  schedule:
    - cron: "0 1 * * 1"      # Mondays 01:00 UTC  (= 01:00 UK in winter / 02:00 UK in summer)
  workflow_dispatch:          # allows a manual "Run workflow" click

permissions:
  contents: write             # so the job can commit results back

concurrency:
  group: malaria-rct-data     # shared with backfill.yml: never write data/ twice at once
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: local::.   # installs this package + its dependencies

      - name: Run weekly scan
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
        run: Rscript -e 'malariarct::run_weekly()'

      - name: Commit results
        run: |
          git config user.name  "malaria-rct-bot"
          git config user.email "actions@github.com"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git add data outputs
          if git diff --staged --quiet; then
            echo "No changes this week."
          else
            git commit -m "Weekly scan: $(date -u +%Y-%m-%d)"
            git push
          fi
